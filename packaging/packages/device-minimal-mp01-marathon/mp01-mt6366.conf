# Minimal Phone MP01 (MT6789 AFE + MT6366 codec + OCA72390 speaker PA on
# i2c6 0x58), card driver "mp01-mt6366". Unverified on the phone.
Syntax 4

SectionUseCase."HiFi" {
	File "/Minimal/MP01/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# The Q25's first-open defaults, for the same codec.
BootSequence [
	cset "name='Lineout Volume' 6,6"
	cset "name='Headphone Volume' 6,6"
	cset "name='Handset Volume' 10"
	cset "name='PGA Volume' 4,4"
]
