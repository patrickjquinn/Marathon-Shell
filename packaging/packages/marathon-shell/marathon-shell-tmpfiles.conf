# Marathon Shell — Duranium-compatible /etc factory symlinks.
#
# Ships the real config under /usr/share/factory/etc/... and symlinks them
# into /etc at first boot via systemd-tmpfiles. Lets immutable postmarketOS
# (Duranium) keep /usr cryptographically verifiable while still letting
# users override by replacing the symlink with a real file.
#
# Functionally identical on non-Duranium images: the symlinks point at the
# real files in /usr, PAM and pam_limits resolve through the symlink.

L /etc/pam.d/marathon-shell
L /etc/security/limits.d/99-marathon-rtprio.conf
