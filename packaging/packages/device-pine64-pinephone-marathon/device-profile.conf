# Marathon device profile — PINE64 PinePhone (Allwinner A64, Mali-400)
#
# Read by marathon-shell (DeviceProfile) and marathon-shell-session.
# Installed to /etc/marathon/device-profile.conf by this overlay aport,
# overriding the device-agnostic default in marathon-base-config.

DEVICE_ID=pine64-pinephone
GPU_STACK=mesa-lima
GLES_LEVEL=2.0
SURFACE_ALPHA=0
GPU_MSAA=0
GPU_RGBA16F=0
RENDER_NODE=/dev/dri/renderD128
CPU_GOVERNOR=ondemand
