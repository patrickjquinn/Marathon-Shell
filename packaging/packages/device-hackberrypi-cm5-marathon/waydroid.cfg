# Seed for /var/lib/waydroid/waydroid.cfg; "waydroid init" keeps these.
[properties]
persist.waydroid.multi_windows = true
persist.waydroid.suspend = false
ro.sf.lcd_density = 254
persist.waydroid.width = 480
persist.waydroid.height = 419
# Android runs arm64 code only; Deckard's overlay turns off the 32-bit zygote.
ro.product.cpu.abilist = arm64-v8a
ro.product.cpu.abilist64 = arm64-v8a
ro.product.cpu.abilist32 =
