# Marathon device profile — HackberryPi CM5 (BCM2712, V3D 7.1, HyperPixel 4.0
# Square 720x720). Replaces the generic Pi 5 profile; keys left out keep the
# shell's built-in defaults.
#
# PANEL_DPI: true pitch of the 4" panel. hackberrypi.dts reports it at 144 mm
# (2x) for the shell's own scale; Wayland clients such as Pacific get the
# real size from this.

DEVICE_ID=hackberrypi-cm5
GPU_STACK=mesa-v3d
PANEL_DPI=254

# HyperPixel on RP1 DPI doesn't recover once its pixel stream stops: blank
# the backlight only. brcmfmac power save drops the Wi-Fi link.
DOZE_DPMS=0
WIFI_POWERSAVE=0
# Only the power key wakes the screen, and the HackberryPi's is out of
# reach: don't blank on idle.
SCREEN_TIMEOUT_MS=0
# V3D does 4x MSAA. The panel is wired 6 bits per channel (BGR666 CPADHI)
# and RP1 DPI doesn't dither, so the shell does.
GPU_MSAA=4
PANEL_DEPTH=6
# The panel's true pitch drives the shell's scale (~1.6x), the scale its
# square-screen layouts are written for; the DT's doubled width-mm doesn't.
FORCE_DPI=254
