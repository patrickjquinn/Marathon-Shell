[Service]
# Qt6 EGLFS_KMS on Librem 5: /dev/dri/card0 is etnaviv (GPU render-only,
# zero connectors); /dev/dri/card1 is LCDIF + nwl-dsi with the DSI-1
# panel. Without explicit config Qt's libudev-backed auto-detect picks
# card0, drmModeGetResources returns no CRTCs, marathon-shell-bin
# aborts with FATAL "Cannot create window: no screens available".
#
# Qt does NOT honor a QT_QPA_EGLFS_KMS_DEVICE env var (a common myth in
# embedded blog posts). The only sanctioned mechanism per Qt's docs is
# QT_QPA_EGLFS_KMS_CONFIG pointing to a JSON file with a "device" key.
# See https://doc.qt.io/qt-6/embedded-linux.html
#
# We ship the JSON at /etc/marathon/eglfs-kms.json (installed by this
# aport). greetd inherits this Environment= → marathon-shell-session →
# marathon-shell-bin. L5-only — Pi 5 / QEMU don't get the drop-in so
# Qt's default udev auto-detect runs there.
Environment=QT_QPA_EGLFS_KMS_CONFIG=/etc/marathon/eglfs-kms.json
