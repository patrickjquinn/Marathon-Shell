# Marathon · Librem 5 card profiles
#
# The wm8962's UCM has only the HiFi verb, so PipeWire offers device
# combinations rather than a "Voice Call" profile; the BM818's PCM reaches
# the codec through the SoC's SAI either way. Marathon's call policy
# (marathon/call-routing.lua) switches to the earpiece or speakerphone
# combination for a call; media uses the speaker and built-in mic, and the
# card would otherwise come up with no profile.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        marathon.call.profile         = "HiFi (Handset1, Handset2)"
        marathon.call.speaker-profile = "HiFi (Handset2, Speaker)"
      }
    }
  }
]

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        priorities = [ "HiFi (Mic, Speaker)" ]
      }
    }
  }
]
