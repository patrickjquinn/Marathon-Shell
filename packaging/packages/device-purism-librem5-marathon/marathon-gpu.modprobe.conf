# Marathon Librem 5 GPU driver arbitration.
#
# The GC7000Lite can be driven by EITHER the open etnaviv driver OR NXP's
# proprietary Vivante galcore module — never both (they bind the same
# hardware). Which one loads is decided at boot by marathon-gpu-select.service
# from GPU_STACK in /etc/marathon/device-profile.conf, NOT by udev modalias
# autoload. Blacklist both here so udev can't race a driver onto the GPU
# before the selector runs.
#
# etnaviv is CONFIG_DRM_ETNAVIV=m (was =y) precisely so it can be arbitrated
# this way. The display controllers (mxsfb / imx-dcss) are independent and
# unaffected — the panel comes up with or without a GPU driver, so a failed
# selection degrades to software render, never a black screen.
blacklist etnaviv
blacklist galcore
