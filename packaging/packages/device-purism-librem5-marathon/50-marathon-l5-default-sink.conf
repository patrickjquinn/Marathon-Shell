# Marathon · Librem 5 default audio sink priority
#
# The L5 exposes two ALSA outputs: the built-in speaker (platform-sound,
# HiFi__Speaker__sink) and HDMI (platform-sound-hdmi.stereo-fallback).
# Out of the box wireplumber picks HDMI as the default sink even when
# nothing is plugged into it — every Marathon sound (notifications,
# ringtones, in-call audio, media playback) goes to the dead HDMI port
# and the user hears silence.
#
# Boost the built-in speaker's priority above HDMI so wireplumber picks
# it as the system default. HDMI keeps its standard priority and will be
# auto-selected the moment a display is plugged in (because the new node
# wins by recency, not by priority alone).
#
# This is L5-specific because the dual-sink situation is. Other Marathon
# targets have a single output and don't need the rule.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
        node.description = "Built-in Speaker"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
        node.description = "Built-in Microphone"
      }
    }
  }
]
