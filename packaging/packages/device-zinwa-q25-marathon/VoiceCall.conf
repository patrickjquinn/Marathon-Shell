# q25-mt6366 "Voice Call": modem (CCCI/PCM_2) <-> MT6366 through the AFE interconnect.
# The modem-side stream is NOT carried by these PCMs: the call helper must hold the
# Hostless_Speech front end (pcm 5) open in both directions for the whole call, as the stock
# HAL does, and switch speech on over /dev/ccci_aud. PlaybackPCM/CapturePCM point at the normal
# DL1/UL1 so PipeWire can still play in-call tones and record.
# Stock control names (audio_device.xml). The Q25 speaker is analog (LOL -> OCA72390), so
# speakerphone uses ADDA_DL, not the stock smart-PA I2S3 route.

SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='AIF Out Mux' 'Normal Path'"
		# downlink: modem -> codec
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' on"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' on"
		# uplink: codec mic -> modem
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' on"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' on"
	]
	DisableSequence [
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1' off"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1' off"
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1' off"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2' off"
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]
	Value {
		TQ "Voice"
		PlaybackChannels 2
		CaptureChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]
	EnableSequence [
		cset "name='RCV Mux' 'Voice Playback'"
		cset "name='Earpiece Switch' on"
	]
	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RCV Mux' Open"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Earpiece" "Headphones" ]
	EnableSequence [
		cset "name='LOL Mux' Playback"
		cset "name='HPL Mux' 'LoudSPK Playback'"
		cset "name='HPR Mux' 'LoudSPK Playback'"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='LOL Mux' Open"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN0"
		cset "name='PGA Volume' 3,3"
		cset "name='Main Mic Switch' on"
	]
	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='Mic Type Mux' Idle"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
	}
}


# Headphones/Headset: as in HiFi.conf, available only while the ACCDET jack is plugged.
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Earpiece" "Speaker" ]
	EnableSequence [
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
		cset "name='Headphones Switch' on"
	]
	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]
	Value {
		PlaybackPriority 500
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphones Jack"
	}
}

# Headset mic: AIN1 on MICBIAS1 (stock headset_mic_input), ACC.
SectionDevice."Headset" {
	Comment "Headset Microphone"
	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN1"
		cset "name='PGA R Mux' AIN1"
		cset "name='PGA Volume' 3,3"
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='Mic Type Mux' Idle"
	]
	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},1"
		JackControl "Headset Mic Jack"
	}
}
