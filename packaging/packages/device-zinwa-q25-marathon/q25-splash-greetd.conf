[Unit]
Wants=q25-splash-handover.service

[Service]
# The splash's bar stops at half, its frame stays on screen, and Plymouth gives
# up the display; the shell draws the same frame first and fills the rest.
# fbcon is unbound first: Plymouth returns tty1 to text mode, and with no DRM
# master fbcon would put its framebuffer back on screen.
ExecStartPre=-/bin/sh -c "for v in /sys/class/vtconsole/vtcon*; do grep -q \"frame buffer\" $$v/name && echo 0 > $$v/bind; done; /usr/bin/plymouth update --status=marathon-handover; sleep 0.1; /usr/bin/plymouth deactivate"
