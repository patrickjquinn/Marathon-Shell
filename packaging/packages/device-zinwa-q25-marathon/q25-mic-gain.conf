# The built-in mic's software gain. Stock records with the PGA at +24 dB
# (HiFi.conf) and adds +14 dB in software (vendor RecordVol "Sound
# recording": ul_gain 34 = PGA idx 4 + 14 dB SW AGC); without it a voice at
# arm's length barely registers. A smart filter, so only streams recording
# from the built-in mic pass through it: Bluetooth, USB and headset mics are
# left alone. No limiter in PipeWire's builtin set: peaks clamp at full scale.
context.modules = [
    {   name = libpipewire-module-filter-chain
        # Without its plugins the gain is lost, never all of PipeWire.
        flags = [ nofail ]
        args = {
            node.description = "Built-in microphone"
            media.name = "Built-in microphone"
            filter.graph = {
                nodes = [
                    {   type = builtin name = gain label = linear
                        control = { "Mult" = 5.012 "Add" = 0.0 }
                    }
                    {   type = builtin name = clip label = clamp
                        control = { "Min" = -1.0 "Max" = 1.0 }
                    }
                ]
                links = [ { output = "gain:Out" input = "clip:In" } ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "q25_mic_gain.capture"
                node.passive = true
            }
            playback.props = {
                node.name = "q25_mic_gain"
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = "q25-mic-gain"
                filter.smart.target = { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
            }
        }
    }
]
