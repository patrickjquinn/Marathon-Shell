# q25-mt6366: pcm 0 = DL1 playback, pcm 1 = UL1 capture (stereo, both channels carry the
# selected mic). No jack detection yet (MT6358 ACCDET not ported): Headphones and Headset
# carry lower priorities than Speaker and the internal mic and have no JackControl.

SectionVerb {
	# DPCM: a front-end PCM only opens once its back-end routes are connected.
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='AIF Out Mux' 'Normal Path'"
	]
	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]
	Value {
		TQ "HiFi"
		PlaybackChannels 2
		CaptureChannels 2
	}
}

# Speaker: LOL -> OCA72390. Mainline mt6358 sequences the line-out driver and DAC only in the
# HP "LoudSPK Playback" path, so both HP muxes select it (stock "headphoneSpeaker_output").
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Headphones" "Earpiece" ]
	EnableSequence [
		cset "name='LOL Mux' Playback"
		cset "name='HPL Mux' 'LoudSPK Playback'"
		cset "name='HPR Mux' 'LoudSPK Playback'"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='LOL Mux' Open"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Speaker" "Earpiece" ]
	EnableSequence [
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
		cset "name='Headphones Switch' on"
	]
	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
	}
}

# Earpiece: MT6366 receiver amp (stock receiver_output). Also the device a future voice-call
# verb will use; the modem speech path (MOD_DAI/speech DSP) is not implemented yet.
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]
	EnableSequence [
		cset "name='RCV Mux' 'Voice Playback'"
		cset "name='Earpiece Switch' on"
	]
	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RCV Mux' Open"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
	}
}

# Mics: ACC (stock DT mediatek,mic-type = 1). The PGA is fixed at +18 dB and capture
# volume is left to PipeWire's software volume (the PGA has only 6 dB steps).
# AIN0 = bottom main mic (stock builtin_Mic_SingleMic); AIN2 = second mic (~10 dB less
# pickup from the bottom speaker in the 2026-10-30 loopback test).
SectionDevice."Mic" {
	Comment "Internal Microphone"
	ConflictingDevice [ "Headset" "SecondaryMic" ]
	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN0"
		cset "name='PGA Volume' 3,3"
		cset "name='Main Mic Switch' on"
	]
	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='Mic Type Mux' Idle"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."SecondaryMic" {
	Comment "Second Microphone"
	ConflictingDevice [ "Mic" "Headset" ]
	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN2"
		cset "name='PGA R Mux' AIN2"
		cset "name='PGA Volume' 3,3"
		cset "name='Second Mic Switch' on"
	]
	DisableSequence [
		cset "name='Second Mic Switch' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='Mic Type Mux' Idle"
	]
	Value {
		CapturePriority 80
		CapturePCM "hw:${CardId},1"
	}
}

# Headset mic (AIN1, MICBIAS1 2.6 V). Unverified: needs a headset and, for auto-switching,
# the ACCDET port. Kept below the internal mic.
SectionDevice."Headset" {
	Comment "Headset Microphone"
	ConflictingDevice [ "Mic" "SecondaryMic" ]
	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN1"
		cset "name='PGA R Mux' AIN1"
		cset "name='PGA Volume' 3,3"
		cset "name='Headset Mic Switch' on"
	]
	DisableSequence [
		cset "name='Headset Mic Switch' off"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='Mic Type Mux' Idle"
	]
	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
	}
}
