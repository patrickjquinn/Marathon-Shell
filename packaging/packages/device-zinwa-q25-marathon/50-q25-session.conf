[Service]
# Select a package-owned config without replacing marathon-base-config's file.
ExecStart=
ExecStart=greetd --config /etc/greetd/q25-config.toml
# greetd runs initial_session once per boot, marked by this file; after a
# restart it would start the shell as the greeter session instead, which
# polkit does not trust (calls could not be answered). Always autologin.
ExecStartPre=-/bin/rm -f /run/greetd.run
