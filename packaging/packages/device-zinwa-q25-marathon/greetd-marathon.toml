# Q25: canonical 1.5x UI policy; not a physical panel DPI measurement.
# Native Wayland children receive Marathon DPI/protocol scale, not QT_SCALE_FACTOR.
# Keep dbus/session/cgroup setup in marathon-shell-session.
[terminal]
vt = 1

[default_session]
command = "/usr/bin/env MARATHON_FORCE_DPI=240 /usr/bin/marathon-shell-session"
user = "user"

[initial_session]
command = "/usr/bin/env MARATHON_FORCE_DPI=240 /usr/bin/marathon-shell-session"
user = "user"
