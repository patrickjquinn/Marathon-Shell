# Zinwa Q25 (MT6789 AFE + MT6366 codec + OCA72390 speaker PA), card driver "q25-mt6366".
# Verified on device 2026-10-30 with PipeWire/ACP (speaker, earpiece, internal mic).
Syntax 4

SectionUseCase."HiFi" {
	File "/Zinwa/Q25/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# Safe defaults applied once when the card is first opened by UCM.
BootSequence [
	cset "name='Lineout Volume' 6,6"
	cset "name='Headphone Volume' 6,6"
	cset "name='Handset Volume' 10"
	cset "name='PGA Volume' 3,3"
]
