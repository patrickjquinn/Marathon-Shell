# Marathon OS System Tuning
# Memory management optimized for zram and low-latency

# zram-friendly behavior. swappiness 100 was originally chosen on the
# theory that zram compression is cheap and we should let the kernel
# move anything to swap freely. On-device profiling told a different
# story: under app-launch memory pressure the kernel preferentially
# compressed the shell's own anonymous pages (render-thread state, QML
# scene graph buffers) and every gesture after that decompressed on
# the render thread — felt to the user as "the second app I launch
# makes the whole UI heavy."
#
# swappiness=10 flips the bias: the kernel reclaims file-cache pages
# first, only compressing anonymous pages when there's nothing else
# left. zram is still doing real work for backgrounded app data
# (apps are large), the shell's hot pages just stay resident.
vm.swappiness = 10
vm.page-cluster = 0
vm.watermark_scale_factor = 125
vm.watermark_boost_factor = 0

# flash writeback (F2FS + ext4 on eMMC/UFS)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_writeback_centisecs = 1500

# cache tuning
vm.vfs_cache_pressure = 50

# Memory compaction for better performance
vm.compact_unevictable_allowed = 1
vm.compaction_proactiveness = 20

# OOM killer tuning
vm.oom_kill_allocating_task = 0
vm.overcommit_memory = 1
vm.overcommit_ratio = 50

# Network performance
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_congestion_control = bbr

# Additional TCP optimizations
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fack = 1
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_mtu_probing = 1

# UDP optimizations
net.core.rmem_default = 262144
net.core.wmem_default = 262144

# Reduce latency for interactive workloads.
# CFS knobs (removed in Linux 6.0+ when EEVDF replaced CFS) — the `-`
# prefix lets sysctl silently no-op on newer kernels.
-kernel.sched_latency_ns = 6000000
-kernel.sched_min_granularity_ns = 2000000
-kernel.sched_wakeup_granularity_ns = 3000000


