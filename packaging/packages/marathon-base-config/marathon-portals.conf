# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=marathon. The GTK and
# gnome-keyring portals only declare themselves for GNOME, so without this
# file no backend is chosen. wlr is left out: Marathon is not a wlroots
# compositor, so its screencast protocols are not there.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
# The shell answers appearance, org.gnome.desktop.interface and
# org.kde.kdeglobals.* from the ambience; GTK's backend answers the rest.
# xdg-desktop-portal >= 1.19.1 merges ReadAll per key with the first backend
# winning; older ones concatenate, and GTK, reading in order, keeps gtk's.
org.freedesktop.impl.portal.Settings=marathon;gtk
