# xdg-desktop-portal backends for XDG_CURRENT_DESKTOP=marathon. The GTK and
# gnome-keyring portals only declare themselves for GNOME, so without this
# file no backend is chosen. wlr is left out: Marathon is not a wlroots
# compositor, so its screencast protocols are not there.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
