#
# Marathon: tuned-ppd's "balanced" (and, on battery, "balanced-battery").
# Replaces the stock profile so only the CPU governor is tuned: the device
# profile's CPU_GOVERNOR (ondemand unless an overlay says otherwise).
#

[main]
summary=Marathon balanced: the device profile's CPU governor

[variables]
include=/etc/marathon/device-profile.conf

[cpu]
governor=${CPU_GOVERNOR}|ondemand|schedutil
