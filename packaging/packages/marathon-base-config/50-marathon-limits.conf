# Marathon OS Real-Time Limits
#
# Audio group keeps high RT prio for low-latency audio.
# All users get rtprio 10 so Marathon Shell render threads can elevate
# to SCHED_RR without CAP_SYS_NICE on every binary. Matches the upstream
# Marathon-Shell limits.d entry.

@audio  - rtprio       95
@audio  - nice         -15
@audio  - memlock      unlimited

*       hard rtprio    10
*       soft rtprio    10
