# NetworkManager's connectivity check: it fetches this page on every new
# connection and every 5 minutes. A network that answers with something else
# is behind a captive portal (Connectivity = PORTAL), and the shell offers its
# sign-in; no answer means no internet (LIMITED). Either way NetworkManager
# prefers another connection, mobile data, until it passes. Plain HTTP on
# purpose: a portal can only redirect an unencrypted request. GNOME's check
# endpoint, which answers "NetworkManager is online".
[connectivity]
uri=http://nmcheck.gnome.org/check_network_status.txt
interval=300
