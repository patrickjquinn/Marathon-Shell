# Marathon device profile — device-agnostic DEFAULT.
#
# Shipped by marathon-base-config to /etc/marathon/device-profile.conf as the
# fallback for any image whose device overlay does not ship its own profile.
# A device overlay (packages/device-<vendor>-<model>-marathon) installs its own
# device-profile.conf on top of this one to declare hardware-specific traits.
#
# Values here are conservative and match marathon-shell's built-in DeviceProfile
# defaults, so an un-provisioned device behaves identically to pre-profile
# Marathon. See docs/DEVICE_OVERLAYS.md (Marathon-Shell) for the full schema.
#
# Any field can be overridden at runtime by the matching MARATHON_* env var,
# which always wins over this file (used for host/dev testing).

DEVICE_ID=generic
GPU_STACK=mesa-etnaviv
GLES_LEVEL=2.0
SURFACE_ALPHA=0
GPU_MSAA=0
GPU_RGBA16F=0
RENDER_NODE=/dev/dri/renderD128
CPU_GOVERNOR=ondemand
BRIGHTNESS_FLOOR=0.28
