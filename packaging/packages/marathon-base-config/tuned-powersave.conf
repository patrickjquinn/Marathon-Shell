#
# Marathon: tuned-ppd's "power-saver" (Battery Saver). The CPU sits at its
# lowest clock; the shell's InputBoost still raises the floor while the
# user touches the screen. Replaces the stock profile, whose USB
# autosuspend and disk settings would reach the modem and the keyboard.
#

[main]
summary=Marathon power saver: the lowest CPU clock

[cpu]
governor=powersave
