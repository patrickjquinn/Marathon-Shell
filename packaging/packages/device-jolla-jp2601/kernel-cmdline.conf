# splash first: the initramfs takes the first splash word it finds.
splash
console=tty0
# The kernel's lines land on VT1, which has no fbcon (below), so they stay
# off the splash and still reach ramoops, which U-Boot shows after a crash.
loglevel=7
systemd.show_status=false
vt.global_cursor_default=0
# simpledrm on LK's framebuffer is the only display driver, so Plymouth
# has to use it.
plymouth.use-simpledrm
# VT1 stays a dummy console: with no DRM master after Plymouth lets go,
# fbcon would put its own frame back over the shell's.
fbcon=vc:2-63
fbcon=font:TER16x32
# No clock or PMIC drivers yet: nothing LK left running may be switched off.
clk_ignore_unused
pd_ignore_unused
panic=30
