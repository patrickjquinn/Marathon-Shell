# Marathon device profile — Raspberry Pi 5 / CM5 (BCM2712, V3D 7.1)
#
# Read by marathon-shell (DeviceProfile) and marathon-shell-session. Installed
# to /etc/marathon/device-profile.conf by this overlay aport, overriding the
# device-agnostic default in marathon-base-config. Keys left out keep the
# shell's built-in defaults. device-hackberrypi-cm5-marathon replaces this
# file with its own.

DEVICE_ID=raspberry-pi5
GPU_STACK=mesa-v3d

# brcmfmac power save drops the Wi-Fi link.
WIFI_POWERSAVE=0
