# The same override for the per-user installation, where the Store installs:
# Flatpak reads the system override only for system-installed apps. L leaves
# a user's own global override alone, and `flatpak override --user` replaces
# the link with a merged file.
d %h/.local/share/flatpak/overrides 0755 - - -
L %h/.local/share/flatpak/overrides/global - - - - /usr/share/marathon/flatpak-overrides
