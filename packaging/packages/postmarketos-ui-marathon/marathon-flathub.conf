# Marathon: register Flathub as the default Flatpak remote at first boot.
#
# tmpfiles.d type "x" can't run flatpak directly, so we use a one-shot
# systemd unit instead — see marathon-flathub-setup.service. This file
# is kept for any future tmpfiles-managed directories Marathon's app
# layer expects.
d /var/lib/flatpak 0755 root root - -
