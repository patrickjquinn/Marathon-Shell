# Jolla Phone (2026): MT6858 AFE + MT6369 codec, card driver "mt6858-mt6369".
Syntax 4

SectionUseCase."HiFi" {
	File "/Jolla/JP2601/HiFi.conf"
	Comment "Play HiFi quality Music"
}

# Only with the kernel's modem speech path (linux-mt6858 r20): a verb whose
# controls are missing makes PipeWire drop the card's UCM altogether.
If.speech {
	Condition {
		Type ControlExists
		Control "name='I2SOUT1_CH1 PCM_1_CAP_CH1'"
	}
	True {
		SectionUseCase."Voice Call" {
			File "/Jolla/JP2601/VoiceCall.conf"
			Comment "Phone call"
		}
	}
}
