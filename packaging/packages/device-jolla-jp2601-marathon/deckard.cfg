# Seed for /var/lib/deckard/deckard.cfg; Deckard's Init keeps these.
# Android's display is Marathon's app area at scale 2: the panel's
# 1032x2272 less 63 dp of shell chrome (the 33 dp status bar, as deep as
# the notch, and the 30 dp gesture bar), derived, not measured.
[properties]
persist.deckard.multi_windows = true
persist.deckard.suspend = false
ro.sf.lcd_density = 320
persist.deckard.width = 516
persist.deckard.height = 1073
