# Seed for /var/lib/deckard/deckard.cfg; Deckard's Init keeps these.
# Android's display is Marathon's app area at scale 2.1: the panel's
# 1032x2272 less 129 px of shell chrome (the 66 px status bar, as deep as
# the notch, and the 63 px gesture bar), derived, not measured.
[properties]
persist.deckard.multi_windows = true
persist.deckard.suspend = false
ro.sf.lcd_density = 336
persist.deckard.width = 491
persist.deckard.height = 1020
