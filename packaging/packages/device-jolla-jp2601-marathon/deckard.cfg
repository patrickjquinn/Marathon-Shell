# Seed for /var/lib/deckard/deckard.cfg; Deckard's Init keeps these.
# Android's display is Marathon's app area at the shell's native-client
# scale, 2.75 (DPI 336/160 x interface size 1.25, in quarter steps): the
# panel's 1032x2272 less the 74 px status bar and the 79 px gesture bar,
# measured from a shell screenshot. 1031x2120 px at 440 dpi.
[properties]
persist.deckard.multi_windows = true
persist.deckard.suspend = false
ro.sf.lcd_density = 440
persist.deckard.width = 375
persist.deckard.height = 771
