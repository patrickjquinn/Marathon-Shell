# mt6858-mt6369: pcm 0 = DL0 playback over I2SOUT1 to the two AW88271
# amplifiers (bottom on the left slot, top on the right), pcm 2 = UL0
# capture over MTKAIF from the MT6369.

SectionVerb {
	# DPCM: a front-end PCM only opens once its back-end routes are connected.
	EnableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' on"
		cset "name='I2SOUT1_CH2 DL0_CH2' on"
		cset "name='UL0_CH1 ADDA_UL_CH1' on"
		cset "name='UL0_CH2 ADDA_UL_CH2' on"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='AIF Out Mux' 'Normal Path'"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
	]
	DisableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' off"
		cset "name='I2SOUT1_CH2 DL0_CH2' off"
		cset "name='UL0_CH1 ADDA_UL_CH1' off"
		cset "name='UL0_CH2 ADDA_UL_CH2' off"
	]
	Value {
		TQ "HiFi"
		PlaybackChannels 2
		CaptureChannels 2
	}
}

# Both amplifiers on their music profile. Their volume controls are an
# attenuation in 6/64 dB steps from the profile's own level. Stock runs
# Awinic's speaker protection on the SCP, which nothing does here, so the
# amplifiers stay 6 dB below the profile: PipeWire's software volume at
# 100% cannot drive them harder.
SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		cset "name='Bottom Profile Set' Music"
		cset "name='Top Profile Set' Music"
		cset "name='Bottom PCM Playback Volume' 64"
		cset "name='Top PCM Playback Volume' 64"
		cset "name='Earpiece Switch' off"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

# The top amplifier alone, on its receiver profile, is the earpiece.
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Top Profile Set' Receiver"
		cset "name='Top PCM Playback Volume' 0"
		cset "name='Speakers Switch' off"
		cset "name='Earpiece Switch' on"
	]
	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='Top Profile Set' Music"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

# AIN0 is the main microphone (stock: ACC, MICBIAS0), on both channels.
# The preamplifier is at +24 dB, its maximum; capture volume above that
# is PipeWire's software volume.
SectionDevice."Mic" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='ADC_R_Mux' 'Right Preamplifier'"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='PGA_R_Mux' AIN0"
		cset "name='PGA1 Volume' 4"
		cset "name='PGA2 Volume' 4"
	]
	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='PGA_R_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADC_R_Mux' Idle"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}

# AIN2 is the second microphone, also on MICBIAS0. AIN1 (MICBIAS1) is
# the USB-C headset's.
SectionDevice."Mic2" {
	Comment "Second Microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='ADC_R_Mux' 'Right Preamplifier'"
		cset "name='PGA_L_Mux' AIN2"
		cset "name='PGA_R_Mux' AIN2"
		cset "name='PGA1 Volume' 4"
		cset "name='PGA2 Volume' 4"
	]
	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='PGA_R_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADC_R_Mux' Idle"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
