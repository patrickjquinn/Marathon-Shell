[Unit]
Wants=jp2601-splash-handover.service

[Service]
# fbcon is unbound first: with no DRM master it would put its framebuffer
# back on screen. Plymouth then gives up the display and keeps its frame
# until the shell has the framebuffer (jp2601-splash-handover).
ExecStartPre=-/bin/sh -c "for v in /sys/class/vtconsole/vtcon*; do grep -q \"frame buffer\" $$v/name && echo 0 > $$v/bind; done; /usr/bin/plymouth deactivate"
