# mt6858-mt6369 "Voice Call": the modem's speech PCM (PCM 1) to the AW88271
# amplifiers over I2SOUT1, and the main microphone over MTKAIF to the modem
# (stock audio_device.xml: MD1_TO_I2S1, MIC1_MD1_TO_I2S1). These routes carry
# sound only while jp2601-speech holds the Hostless_Speech PCM open, as the
# stock HAL does. PlaybackPCM/CapturePCM stay on DL0/UL0 for in-call tones.

SectionVerb {
	EnableSequence [
		cset "name='I2SOUT1_CH1 DL0_CH1' on"
		cset "name='I2SOUT1_CH2 DL0_CH2' on"
		cset "name='UL0_CH1 ADDA_UL_CH1' on"
		cset "name='UL0_CH2 ADDA_UL_CH2' on"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='AIF Out Mux' 'Normal Path'"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
		# downlink: modem -> amplifiers
		cset "name='I2SOUT1_CH1 PCM_1_CAP_CH1' on"
		cset "name='I2SOUT1_CH2 PCM_1_CAP_CH1' on"
		# uplink: main microphone -> modem
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' on"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH1' on"
	]
	DisableSequence [
		cset "name='I2SOUT1_CH1 PCM_1_CAP_CH1' off"
		cset "name='I2SOUT1_CH2 PCM_1_CAP_CH1' off"
		cset "name='PCM_1_PB_CH1 ADDA_UL_CH1' off"
		cset "name='PCM_1_PB_CH2 ADDA_UL_CH1' off"
		cset "name='I2SOUT1_CH1 DL0_CH1' off"
		cset "name='I2SOUT1_CH2 DL0_CH2' off"
		cset "name='UL0_CH1 ADDA_UL_CH1' off"
		cset "name='UL0_CH2 ADDA_UL_CH2' off"
	]
	Value {
		TQ "Voice"
		PlaybackChannels 2
		CaptureChannels 2
	}
}

# The top amplifier alone, on its receiver profile.
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='Top Profile Set' Receiver"
		cset "name='Top PCM Playback Volume' 0"
		cset "name='Speakers Switch' off"
		cset "name='Earpiece Switch' on"
	]
	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='Top Profile Set' Music"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
	}
}

# Speakerphone: both amplifiers on their music profile, 6 dB down as in HiFi.
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
	]
	EnableSequence [
		cset "name='Bottom Profile Set' Music"
		cset "name='Top Profile Set' Music"
		cset "name='Bottom PCM Playback Volume' 64"
		cset "name='Top PCM Playback Volume' 64"
		cset "name='Earpiece Switch' off"
		cset "name='Speakers Switch' on"
	]
	DisableSequence [
		cset "name='Speakers Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	EnableSequence [
		cset "name='ADC_L_Mux' 'Left Preamplifier'"
		cset "name='ADC_R_Mux' 'Right Preamplifier'"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='PGA_R_Mux' AIN0"
		cset "name='PGA1 Volume' 4"
		cset "name='PGA2 Volume' 4"
	]
	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='PGA_R_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADC_R_Mux' Idle"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
	}
}
