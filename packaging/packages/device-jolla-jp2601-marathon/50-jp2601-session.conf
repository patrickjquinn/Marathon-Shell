[Service]
# A package-owned config, leaving marathon-base-config's file alone.
ExecStart=
ExecStart=greetd --config /etc/greetd/jp2601-config.toml
# greetd runs initial_session once per boot, marked by this file; after a
# restart it would start the shell as the greeter session, which polkit
# does not trust. Always autologin.
ExecStartPre=-/bin/rm -f /run/greetd.run
