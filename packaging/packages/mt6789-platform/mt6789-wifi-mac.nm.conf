# gen4m has no calibration NVRAM and makes up a new MAC every boot. Give
# each network its own address instead, kept across boots and updates
# (from the SSID and NetworkManager's per-install secret_key), as Android
# does: portal sign-ins and DHCP reservations survive a reboot, and
# networks can't link the phone by its address.
[connection-mt6789-wifi-mac]
match-device=type:wifi
wifi.cloned-mac-address=stable-ssid
