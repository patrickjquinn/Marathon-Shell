# pilotd on Marathon OS, read when the person has no
# ~/.config/shoal-pilot/pilotd.toml of their own.

# No privacy switch on Marathon's phones.
[privacy]
source = "none"

# Pilot is started through the shell (Navigation1.StartAppInBackground),
# behind the app on screen, so it may show its overlay over that app.
[events]
open_command = ["/usr/libexec/shoal-pilot/marathon-open", "/usr/bin/shoal-pilot"]

[sheet]
open_command = ["/usr/libexec/shoal-pilot/marathon-open", "/usr/bin/shoal-pilot"]

# The model runs on the phone (llama-server on 127.0.0.1:8088): no relay,
# no licence, nothing leaves the phone.
[local]
enabled = true
