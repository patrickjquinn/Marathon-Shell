# The receiver is gps_drv's data link, /dev/gpsdl0; marathon-gnssd boots
# its DSP through TF-A there.
[Unit]
Wants=mt6858-gnss.service
After=mt6858-gnss.service

[Service]
ExecStart=
ExecStart=/usr/bin/marathon-gnssd --state /var/lib/marathon-gnssd/position --device /dev/gpsdl0
DeviceAllow=char-gps_data_link_cdev rw
