<?xml version="1.0" encoding="UTF-8"?>
<!--
  Marathon DS · teal radial halo asset.
  Used behind hero text (lock clock, dialer number, calc readout, OOBE
  glyph) via MHaloedDisplay. Static gradient — colour is design-locked
  to teal-bright at 20% centre fading to transparent at 65%.

  Sized as 200x200; Image scales to whatever container it's in.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1de9b6" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#040404" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#h)"/>
</svg>
