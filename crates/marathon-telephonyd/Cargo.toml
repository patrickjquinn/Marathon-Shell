[package]
name = "marathon-telephonyd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-io = "2.6.0"
blocking = "1.7.0"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
marathon-rt = { path = "../marathon-rt" }
rusqlite = "0.40.2"
serde = "1.0.229"
tz-rs = "0.7.3"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
marathon-rt = { path = "../marathon-rt", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
