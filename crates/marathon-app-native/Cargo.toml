[package]
name = "marathon-app-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The app runner's Rust half: Marathon.Platform's clients of the shell"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
async-io = "2.6.0"
cxx = "1.0.205"
cxx-qt = { version = "=0.10.0", default-features = false }
cxx-qt-lib = { version = "=0.10.0", default-features = false }
futures-lite = "2.6.1"
marathon-permissions = { path = "../marathon-permissions" }
marathon-rt = { path = "../marathon-rt" }
serde = "1.0.229"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[lints]
workspace = true

[build-dependencies]
cxx-qt-build = "=0.10.0"
