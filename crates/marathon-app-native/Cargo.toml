[package]
name = "marathon-app-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The app runner's Rust half: Marathon.Platform's clients of the shell"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
async-io = "2.6.0"
async-lock = "3.4.2"
blocking = "1.7.0"
cxx = "1.0.205"
cxx-qt = { version = "=0.10.0", default-features = false }
cxx-qt-lib = { version = "=0.10.0", default-features = false }
dirs = "6.0.0"
futures-lite = "2.6.1"
inotify = { version = "0.11.5", default-features = false }
jiff = "0.2.15"
marathon-permissions = { path = "../marathon-permissions" }
marathon-rt = { path = "../marathon-rt", features = ["qt"] }
serde = "1.0.229"
serde_json = "1.0.154"
walkdir = "2.5.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true

[build-dependencies]
cxx-qt-build = "=0.10.0"
