[package]
name = "keel-macros"
description = "Keel Actions: #[keel::action], #[keel::entity] and #[keel::object] (use them through the `keel` crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
