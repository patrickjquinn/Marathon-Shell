[package]
name = "keel-mcp"
description = "keel-mcp (ADR-0018): every Keel app's actions, entities, context and shortcuts as one MCP server, over stdio or a Unix socket"
version.workspace = true
edition.workspace = true
license = "MIT"
publish.workspace = true

[[bin]]
name = "keel-mcp"
path = "src/main.rs"

[dependencies]
inotify = { version = "0.11.5", default-features = false }
keel-actions-schema = { path = "../keel-actions-schema" }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "net", "time", "sync", "fs"] }
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
