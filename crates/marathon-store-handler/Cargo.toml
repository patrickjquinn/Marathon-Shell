[package]
name = "marathon-store-handler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
nix = { version = "0.31.3", features = ["term", "fs", "user"] }
regex = "1.13.1"
quick-xml = "0.42.0"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strip-ansi-escapes = "0.2.1"
sha2 = "0.10.9"
tempfile = "3.27.0"
ureq = "3.4.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
