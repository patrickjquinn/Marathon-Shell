[package]
name = "marathon-shell-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-lock = "3.4.2"
cxx = "1.0.205"
cxx-qt = { version = "=0.10.0", default-features = false }
cxx-qt-lib = { version = "=0.10.0", default-features = false }
futures-lite = "2.6.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[lints]
workspace = true

[build-dependencies]
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
