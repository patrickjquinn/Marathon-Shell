[package]
name = "marathon-shell-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-lock = "3.4.2"
async-tungstenite = { version = "0.35.0", default-features = false, features = ["handshake", "smol-runtime", "futures-rustls-webpki-roots"] }
blocking = "1.7.0"
cxx = "1.0.205"
cxx-qt = { version = "=0.10.0", default-features = false }
cxx-qt-lib = { version = "=0.10.0", default-features = false }
dirs = "6.0.0"
evdev = { version = "0.13.2", default-features = false }
freedesktop_entry_parser = "2.0.1"
futures-lite = "2.6.1"
libc = "0.2.190"
marathon-rt = { path = "../marathon-rt" }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
spellbook = "0.4.2"
tz-rs = "0.7.3"
ureq = "3.4.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[lints]
workspace = true

[build-dependencies]
cc = "1.8.0"
cxx-qt-build = "=0.10.0"

[dev-dependencies]
tempfile = "3.27.0"
