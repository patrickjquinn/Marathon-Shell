[package]
name = "marathon-shell-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-lock = "3.4.2"
async-tungstenite = { version = "0.35.0", default-features = false, features = ["handshake", "smol-runtime", "futures-rustls-webpki-roots"] }
blocking = "1.7.0"
base64 = "0.23.1"
cxx = "1.0.205"
cxx-qt = { version = "=0.10.0", default-features = false }
cxx-qt-lib = { version = "=0.10.0", default-features = false, features = ["qt_gui"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
drm = "0.15.0"
drm-ffi = "0.9.1"
evdev = { version = "0.13.2", default-features = false }
freedesktop_entry_parser = "2.0.1"
fuzzy-matcher = "0.3.7"
futures-lite = "2.6.1"
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mime_guess = "2.0.5"
libc = "0.2.191"
marathon-apps = { path = "../marathon-apps" }
marathon-i18n = { version = "0.1.0", path = "../marathon-i18n" }
marathon-permissions = { path = "../marathon-permissions" }
marathon-qt = { path = "../marathon-qt" }
marathon-rt = { path = "../marathon-rt" }
palette = { version = "0.7.7", default-features = false, features = ["std"] }
quick-xml = "0.42.0"
rusqlite = "0.41.1"
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
spellbook = "0.4.2"
tempfile = "3.27.0"
tz-rs = "0.7.3"
url = "2.5.8"
ureq = "3.5.0"
walkdir = "2.5.0"
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy", "service"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
rust-embed = "8.13.0"

[lints]
workspace = true

[build-dependencies]
cxx-qt-build = "=0.10.0"

