[package]
name = "marathon-apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Marathon's apps: manifests, packages, signatures, the catalogue, installs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
jsonschema = { version = "0.60.2", default-features = false }
libc = "0.2.191"
marathon-permissions = { path = "../marathon-permissions" }
minisign = "0.10.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
