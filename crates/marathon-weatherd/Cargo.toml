[package]
name = "marathon-weatherd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-io = "2.6.0"
blocking = "1.7.0"
futures-lite = "2.6.1"
httpdate = "1.0.3"
marathon-rt = { path = "../marathon-rt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tz-rs = "0.7.3"
tzf-rs = { version = "2.1.3", default-features = false, features = ["bundled"] }
ureq = "3.5.0"
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[lints]
workspace = true
