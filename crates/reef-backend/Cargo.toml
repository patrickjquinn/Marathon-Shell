[package]
name = "reef-backend"
description = "Reef store client backend: catalogue and licences"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish.workspace = true

[[bin]]
# The licence hand-off service, D-Bus activated (src/licenced.rs).
name = "shipwright-reef-licenced"
path = "src/bin/shipwright-reef-licenced.rs"

[dependencies]
futures-lite = "2"
# Claim codes (src/claim_codes.rs): 128 bits from the OS random source.
getrandom = "0.4"
reef-licence = { path = "../reef-licence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The store index lists each app's details file by SHA-256 (src/index.rs).
sha2 = "0.11"
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy", "service"] }

[dev-dependencies]
# Signs test licences; the shipped library only verifies.
reef-licence = { path = "../reef-licence", features = ["sign", "handoff-client"] }

[build-dependencies]
# Embeds SHIPWRIGHT_LICENCE_KEYS as EMBEDDED_KEYS (build.rs).
reef-licence = { path = "../reef-licence", features = ["build"] }

[lints]
workspace = true
