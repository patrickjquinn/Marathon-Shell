[package]
name = "marathon-davd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
base64 = "0.23.1"
blocking = "1.7.0"
futures-lite = "2.6.1"
ical = { version = "0.11.0", default-features = false, features = ["ical", "vcard"] }
marathon-rt = { path = "../marathon-rt" }
quick-xml = "0.42.0"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tz-rs = "0.7.3"
ureq = "3.4.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[dev-dependencies]
marathon-rt = { path = "../marathon-rt", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
