[package]
name = "marathon-qt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "D-Bus values as QML's QVariants and back, for the crates that serve or mirror the shell"

# No tests of its own; it links into the crates that build cxx-qt.
[lib]
test = false
doctest = false

[dependencies]
cxx-qt-lib = { version = "=0.10.0", default-features = false }
marathon-i18n = { path = "../marathon-i18n" }
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[lints]
workspace = true
