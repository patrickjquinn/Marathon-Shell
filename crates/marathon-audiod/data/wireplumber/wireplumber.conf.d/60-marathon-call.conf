# Marathon's in-call routing: switches a card to its call profile while
# ModemManager has a voice call, earpiece or speaker by the
# marathon.call.speakerphone setting (which marathon-audiod writes), once
# the call has held still. It replaces WirePlumber's
# device/find-voice-call-profile.lua, which switched on every call event:
# a call that failed at once overlapped two switches and left the speaker
# silent (see call-routing.lua).
#
# A device whose call profiles are not named "Voice Call ..." names them in
# monitor.alsa.rules (see device-purism-librem5-marathon):
#   marathon.call.profile         = "<earpiece call profile>"
#   marathon.call.speaker-profile = "<speakerphone call profile>"

wireplumber.profiles = {
  main = {
    hooks.device.profile.find-voice-call = disabled
  }
}

wireplumber.components = [
  {
    name = marathon/call-routing.lua, type = script/lua
    provides = hooks.marathon.call-routing
    requires = [ support.modem-manager ]
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.device.profile" }
    ]
    actions = {
      merge = {
        wants = [ hooks.marathon.call-routing ]
      }
    }
  }
]

wireplumber.settings.schema = {
  marathon.call.speakerphone = {
    name = "Speakerphone"
    description = "Route call audio to the loudspeaker instead of the earpiece"
    type = "bool"
    default = false
  }
}
