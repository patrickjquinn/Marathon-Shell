# Marathon's in-call routing, on top of WirePlumber's own: WirePlumber
# switches a card to its call profile while ModemManager has a voice call
# (device/find-voice-call-profile.lua); this picks earpiece or speaker for
# that call from the marathon.call.speakerphone setting, which
# marathon-audiod writes.
#
# A device whose call profiles are not named "Voice Call ..." names them in
# monitor.alsa.rules (see device-purism-librem5-marathon):
#   marathon.call.profile         = "<earpiece call profile>"
#   marathon.call.speaker-profile = "<speakerphone call profile>"

wireplumber.components = [
  {
    name = marathon/call-routing.lua, type = script/lua
    provides = hooks.marathon.call-routing
    requires = [ support.modem-manager ]
  }
]

wireplumber.components.rules = [
  {
    matches = [
      { provides = "policy.device.profile" }
    ]
    actions = {
      merge = {
        wants = [ hooks.marathon.call-routing ]
      }
    }
  }
]

wireplumber.settings.schema = {
  marathon.call.speakerphone = {
    name = "Speakerphone"
    description = "Route call audio to the loudspeaker instead of the earpiece"
    type = "bool"
    default = false
  }
}
