# Marathon's media roles: WirePlumber's role-based linking policy with a
# loopback sink per role, so each role has its own level and a louder role
# ducks or corks a quieter one, as Android's stream types do.
#
# Based on WirePlumber's wireplumber.conf.d.examples/media-role-nodes.conf,
# with the alarm, ringtone and phone roles and priorities feedbackd ships
# for Phosh. marathon-audiod shows and sets the Multimedia loopback's level
# as the media volume and keeps the device itself at full level, so an alarm
# or a ringtone is heard however low the media volume is.
# role-default-target.lua sends streams aimed at the default sink (all of
# Qt's) through their role too.

wireplumber.profiles = {
  main = {
    policy.linking.role-based.loopbacks = required
  }
}

wireplumber.settings = {
  node.stream.default-media-role = "Multimedia"
  # New routes start at full level; audiod would fold WirePlumber's 0.4^3 into media.
  device.routes.default-sink-volume = 1.0
}

wireplumber.components.rules = [
  {
    matches = [
      {
        provides = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            policy.role-based.target = true
            audio.position = [ FL, FR ]
            media.class = Audio/Sink
          }
          playback.props = {
            # Lets the device suspend while the role is silent.
            node.passive = true
            # A role no stream asks for, so loopbacks never chain.
            media.role = "Loopback"
          }
        }
        requires = [ support.export-core, pw.node-factory.adapter ]
      }
    }
  }
]

wireplumber.components = [
  {
    name = marathon/role-default-target.lua, type = script/lua
    provides = hooks.marathon.role-default-target
  }
  {
    type = virtual, provides = policy.linking.role-based.loopbacks
    requires = [ hooks.marathon.role-default-target
                 loopback.sink.role.multimedia
                 loopback.sink.role.notification
                 loopback.sink.role.phone
                 loopback.sink.role.alarm
                 loopback.sink.role.ringtone
                 loopback.sink.role.alert ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.multimedia"
      node.description = "Multimedia"
      capture.props = {
        device.intended-roles = [ "Music", "Movie", "Game", "Multimedia" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Notifications"
      capture.props = {
        device.intended-roles = [ "Notification" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.notification
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.phone"
      node.description = "Calls"
      capture.props = {
        device.intended-roles = [ "Communication", "Phone" ]
        policy.role-based.priority = 25
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.phone
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.alarm"
      node.description = "Alarms"
      capture.props = {
        device.intended-roles = [ "Alarm" ]
        policy.role-based.priority = 30
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "duck"
      }
    }
    provides = loopback.sink.role.alarm
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.ringtone"
      node.description = "Ringtones"
      capture.props = {
        device.intended-roles = [ "Ringtone" ]
        policy.role-based.priority = 40
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.ringtone
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.name = "loopback.sink.role.alert"
      node.description = "Alerts"
      capture.props = {
        device.intended-roles = [ "Alert", "Emergency" ]
        policy.role-based.priority = 100
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "cork"
      }
    }
    provides = loopback.sink.role.alert
  }
]
