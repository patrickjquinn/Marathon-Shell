[package]
name = "marathon-core-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust half of libMarathonCore (app package handling)"

[lib]
# staticlib for libMarathonCore.so (crates/CMakeLists.txt), rlib for cargo test.
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0.205"
pgp = { version = "0.21.0", default-features = false }

[lints]
workspace = true

[build-dependencies]
cxx-build = "1.0.205"

[dev-dependencies]
rand = "0.8"
tempfile = "3.27.0"
