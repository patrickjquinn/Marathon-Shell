[package]
name = "marathon-core-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust half of libMarathonCore (app package handling)"

[lib]
# staticlib for libMarathonCore.so (crates/CMakeLists.txt), rlib for cargo test.
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0.205"
jsonschema = { version = "0.58.6", default-features = false }
minisign = "0.10.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[build-dependencies]
cxx-build = "1.0.205"
