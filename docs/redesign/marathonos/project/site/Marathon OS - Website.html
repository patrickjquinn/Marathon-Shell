function BrandMark({ size = 36, label = false }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 12 }}>
      <span style={{
        width: size, height: size, borderRadius: '50%',
        background: 'linear-gradient(180deg, #1de9b6 0%, #00bfa5 100%)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        border: '1px solid rgba(255,255,255,0.15)',
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.3)',
        flexShrink: 0,

        <svg width={size * 0.58} height={size * 0.58} viewBox="0 0 56 56" fill="none">
          <path d="M10 44V14h6l12 18 12-18h6v30h-6V24L28 40 16 24v20z" fill="#000"/>

        fontSize: 14, fontWeight: 600, letterSpacing: -0.1,

}
