# Rust actions for the Keel Actions runtime tests: a cdylib that the test
# host loads (RTLD_LOCAL, as booster-keel loads apps), with its manifest
# generated by build.rs through keel-actions-codegen.
[package]
name = "keel-actions-test-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
keel = { path = "../../rust/keel" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
keel-actions-codegen = { path = "../../codegen" }

[lints]
workspace = true
