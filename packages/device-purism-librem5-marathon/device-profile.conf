# Marathon device profile — Purism Librem 5 (i.MX 8M Quad, Vivante GC7000Lite)
#
# Read by marathon-shell (DeviceProfile) and marathon-shell-session. Installed
# to /etc/marathon/device-profile.conf by this overlay aport, overriding the
# device-agnostic default shipped in marathon-base-config.
#
# These values currently match the shell's built-in defaults, so wiring this
# file is behaviour-neutral on the L5. Flip GPU_STACK/GLES_LEVEL/GPU_MSAA when
# the proprietary Vivante blob overlay is installed (it exposes GLES 3.1 + MSAA).

DEVICE_ID=purism-librem5
GPU_STACK=mesa-etnaviv
GLES_LEVEL=2.0
SURFACE_ALPHA=0
GPU_MSAA=0
GPU_RGBA16F=0
RENDER_NODE=/dev/dri/renderD128
CPU_GOVERNOR=ondemand
BRIGHTNESS_FLOOR=0.28
