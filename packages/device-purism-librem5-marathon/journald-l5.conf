[Journal]
# Persistent journal on L5 only. marathon-base-config sets Storage=volatile
# image-wide (Android-style ring buffer in tmpfs) so journal corruption from
# long-press power-offs doesn't break boot. On L5 during bring-up we need
# logs to survive a reboot — without them every "what crashed" inquiry
# requires hot-patching from pmOS debug shell.
# Drop this drop-in later once L5 is stable, OR keep it long-term: SDR
# memory and eMMC have plenty of headroom for ~32 MB of logs.
Storage=persistent
SystemMaxUse=64M
SystemKeepFree=128M
SystemMaxFileSize=8M
SystemMaxFiles=8
