# Marathon Shell owns all power policy (PowerKeyListener, Doze,
# PowerPolicyController). logind's defaults (HandlePowerKey=poweroff)
# otherwise act on the same evdev events behind the shell's back and
# power the device off — observed as "screen off, device unreachable".
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore
