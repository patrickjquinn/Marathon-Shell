# Helio G99 traits shared by its boards; no kernel policy is installed here.
schema = 1
id = "mt6789"
name = "MediaTek Helio G99 (MT6789)"
arch = "aarch64"
cpu = "6x Cortex-A55 + 2x Cortex-A76"

[gpu]
name = "Mali-G57 MC2"
render_node = "/dev/dri/renderD128"

# PanVK has no Valhall v9 support, so Vulkan is lavapipe on the CPU.
[gpu.stacks.mesa-panfrost]
driver = "panfrost"
gles_max = "3.1"
msaa = false

[gpu.stacks.llvmpipe]
driver = "Mesa software rendering (bring-up)"
gles_max = "3.0"
msaa = false

[profile]
gpu_stack = "mesa-panfrost"
# Off until live frost renders whole frames on the device: on the Jolla
# (Qt 6.12, Mesa 26.3 panfrost) a capture of the home screen left the
# frame below the shade unpainted. MARATHON_LIVE_BLUR=1 turns it on.
live_blur = false
# PanVK rejects the Mali-G57, so the loader finds no Vulkan device and GTK 4
# renders with GL instead of on the CPU through lavapipe.
vulkan_driver = "panfrost"
