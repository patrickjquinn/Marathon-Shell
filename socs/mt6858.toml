# Jolla Phone (2026) SoC traits; no kernel policy is installed here.
schema = 1
id = "mt6858"
name = "MediaTek Dimensity 7100 (MT6858)"
arch = "aarch64"
cpu = "4x Cortex-A55 + 4x Cortex-A78"

[gpu]
name = "Mali-G610 MC2"
render_node = "/dev/dri/renderD128"

# Panthor, powered through the GPUEB. With no display driver yet, Mesa's
# kmsro pairs it with simpledrm: the GPU renders into simpledrm's dumb
# buffers.
[gpu.stacks.mesa-panfrost]
driver = "panfrost"
gles_max = "3.1"
msaa = false

# The fallback while the GPU does not probe.
[gpu.stacks.llvmpipe]
driver = "Mesa software rendering (bring-up)"
gles_max = "3.0"
msaa = false

[profile]
gpu_stack = "mesa-panfrost"
# Off until live frost renders whole frames on the device: on the Jolla
# (Qt 6.12, Mesa 26.3 panfrost) a capture of the home screen left the
# frame below the shade unpainted. MARATHON_LIVE_BLUR=1 turns it on.
live_blur = false
# PanVK drives the G610 (Valhall CSF), so apps' Vulkan stays on the GPU.
vulkan_driver = "panfrost"
