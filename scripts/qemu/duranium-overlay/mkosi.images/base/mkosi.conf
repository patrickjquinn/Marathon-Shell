[Output]
Format=directory

[Content]
# RootPassword override is applied to the duranium TOP-LEVEL mkosi.conf
# via setup-trees.sh (per mkosi v25 changelog, RootPassword is a
# universal setting that per-image confs cannot override). The hash and
# the rationale live in scripts/qemu/lib/setup-trees.sh.
CleanPackageMetadata=no
Packages=
	postmarketos-duranium
	foot
	alacritty
	xterm
	# QMF mail backend (built via marathon-extras/build-qmf-apk.sh).
	# Provides libQmfClient.so.4 + libQmfMessageServer.so.4 + the
	# messageserver daemon that marathon-mailserver.service launches.
	qmf-libs
	qmf-messageserver
	# OAuth2 + Secret-Service credential helper for QMF
	# (built via marathon-extras/build-marathon-mail-oauth-apk.sh).
	# Installs /usr/bin/marathon-mail-oauth, invoked by the
	# marathonoauth + marathonclassic QMF credential plugins.
	marathon-mail-oauth
	# Avahi daemon so the device PUBLISHES `<hostname>.local` on the
	# LAN. Postinst sets hostname=marathon via /usr/share/factory/
	# etc/hostname + tmpfiles and enables avahi-daemon via systemd
	# preset so dev/QA can ssh root@marathon.local without scraping
	# the DHCP lease. Alpine doesn't ship a separate nss-mdns apk;
	# the publishing-side avahi alone is enough — the *client* host
	# resolves .local via its own nss-mdns.
	avahi
RemovePackages=
	# Ideally this could be excluded in packaging, but it's difficult
	# to do this without causing regressions in mutable pmOS. See:
	# https://gitlab.postmarketos.org/postmarketOS/pmaports/-/work_items/4495#note_548463
	gnome-software-plugin-apk
