# Q25 bring-up device policy.
schema = 1
vendor = "zinwa"
codename = "q25"
id = "zinwa-q25"
name = "Zinwa Q25 Pro"
manufacturer = "Zinwa"
soc = "mt6789"
status = "bring-up"
package = "device-zinwa-q25-marathon"

# No wrapper or flash script yet. The image is a root file on the
# userdata carrier plus new ESP files, and U-Boot is left alone.
[build]
target = "zinwa-q25"
bootloader = "uki"

# U-Boot (lk_a) boots systemd-boot from the nested-GPT ESP inside userdata.
[boot]
method = "uefi"
partition_table = "gpt"

# The prebuilt 7.0.0-q25-cfi-test kernel the phone boots; every module
# package is pinned to it.
[kernel]
package = "linux-postmarketos-mediatek-g99"
version = "7.0-r1000"

[display]
interface = "dsi"
width = 720
height = 720
# UI policy (1.5x), not a measurement of the panel's physical density.
scale_dpi = 240

[input]
touch = "unvalidated by this profile"
keyboard = "RP2040 I2C QWERTY"

[hardware]
modem = "unvalidated by this profile"
gps = "unvalidated by this profile"
wifi = "unvalidated by this profile"
sensors = []

# Copied from the phone's stock vendor partition at build time. The modem
# image is copied from its md1img partition on first boot (q25-modem).
[[firmware]]
package = "q25-connsys-firmware"
version = "20261030"

[profile]
# Constants.scaleFactor = DPI / 160. Do not use QT_SCALE_FACTOR.
# Leave panel_dpi unset until the physical panel dimensions are measured.
force_dpi = 240
# ondemand ramps only past 95% load; schedutil follows the foreground uclamp.
cpu_governor = "schedutil"
# Level 4 of 20 (4.4 V bias) is the lowest that stays clean.
brightness_floor = 0.2
