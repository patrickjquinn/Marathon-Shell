# Jolla Phone (2026), board JP2601, bring-up policy; BRINGUP.md has the
# state of the mainline kernel, what the first image carries and what comes
# next.
schema = 1
vendor = "jolla"
codename = "jp2601"
id = "jolla-jp2601"
name = "Jolla Phone (2026)"
manufacturer = "Jolla"
soc = "mt6858"
status = "bring-up"
package = "device-jolla-jp2601-marathon"

# mkosi builds the root alone; the wrapper puts it on the userdata carrier
# beside an ESP made from the root's /boot, as for the Q25 and the MP01.
[build]
target = "jolla-jp2601"
wrapper = "scripts/build-jolla-jp2601-image.sh"
bootloader = "none"

# The stock LK stays in lk_a/lk_b and loads a mainline U-Boot packed in
# boot_b (slot B); U-Boot maps userdata with blkmap and starts systemd-boot
# from the ESP in it, or, without one, a rescue FIT in boot_b.
[boot]
method = "android-u-boot"
partition_table = "gpt"

# Installed phones boot by jp2601.rootfs_file= and keep the carrier at
# /.jp2601-carrier/root.
[boot.carrier]
name = "jp2601"
dtb = "mediatek/mt6858-jolla-jp2601.dtb"

[kernel]
package = "linux-mt6858"
version = "7.4.0_rc4_git20261124"

[display]
# LK's lcmname: yft_vtdr6126_fhdp_dsi_vdo_90hz_boe_dphy_lcm_drv.
panel = "BOE panel on a Visionox VTDR6126 driver IC, DSI video mode, D-PHY"
interface = "dsi"
width = 1032
height = 2272
diagonal_in = 6.36
# The panel's pitch, 2495 px of diagonal over 6.36 in: 2.45x.
scale_dpi = 392
quirks = [
  "simpledrm on LK's framebuffer, 1056 pixels a line: no DSI or panel driver, so no brightness control or display power-off",
]

[input]
touch = "Hynitron CST66xx (hyn,66xx) on SPI3 (0x11013800) CS0, EINT6; no mainline driver, and SPI waits on clk-mt6858"
keyboard = "none"
quirks = [
  "no power or volume key driver (MT6363 PMIC keys, mtk-kpd): nothing can wake a blanked screen, so it never blanks",
]

[hardware]
ram_mb = 12288
modem = "MT6858 5G modem over CCIF and DPMAIF; no mainline driver"
gps = "CONNSYS GNSS (conninfra soc7_0); no mainline driver"
wifi = "CONNSYS gen4m (wlan_drv_gen4m_6858); no mainline driver"
bluetooth = "CONNSYS (bt_drv_6858); no mainline driver"
battery = "MT6720 charger and fuel gauge on i2c5 0x34"
sensors = []
quirks = [
  "PMICs are MT6363 and MT6369 on SPMI at 0x1c024000",
  "accelerometer and the other motion sensors sit behind the SCP sensor hub, not on the AP",
  "NFC is an ST21NFC part (/dev/st21nfc); fingerprint is Goodix gf_spi with matching in the TEE",
]

[profile]
# Constants.scaleFactor = DPI / 160. Do not use QT_SCALE_FACTOR.
force_dpi = 392
panel_dpi = 392
# No input wakes the screen yet (display.quirks, input.quirks).
screen_timeout_ms = 0
# The camera notch, from Sailfish's cutouts=[[310, 0, 414, 66]].
display_cutout = "310,0,414,66"
# 12 GB, as on the Q25: a warm spare runner with the media folders and one
# without.
runner_pool = 2
