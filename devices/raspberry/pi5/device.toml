# The generic Pi 5 / CM5 base; enclosures such as the HackberryPi layer
# their own overlay on top. Bare-board (HDMI) images are not validated:
# this layer is exercised through the HackberryPi.
schema = 1
vendor = "raspberry"
codename = "pi5"
id = "raspberry-pi5"
name = "Raspberry Pi 5 / Compute Module 5"
manufacturer = "Raspberry Pi"
soc = "bcm2712"
status = "bring-up"
package = "device-raspberry-pi5-marathon"

# No wrapper of its own: scripts/build-image.sh raspberry-pi5. The
# HackberryPi flash script writes this target's image.
[build]
target = "raspberry-pi5"
flash = "scripts/flash/flash-hackberry-cm5.sh"
bootloader = "uki"

# The EEPROM reads config.txt, kernel_2712.img and initramfs_2712 from a
# FAT32 partition (MBR type 0x0c); the root grows to fill the card on
# first boot.
[boot]
method = "pi-firmware"
partition_table = "mbr"
loader = "raspberrypi-bootloader"

# Marathon's fork of Alpine v3.23's 6.12.85, with utilization clamping (edge's
# 6.18 NULL-derefs in initrd udev on a Pi 5).
[kernel]
package = "linux-rpi-marathon"
version = "6.12.85"

[display]
interface = "hdmi"

[input]
touch = "none"
keyboard = "USB"

[hardware]
modem = "none"
gps = "none"
wifi = "Infineon CYW43455 (brcmfmac)"
bluetooth = "Infineon CYW43455"
sensors = []

[[firmware]]
package = "raspberrypi-bootloader"

[profile]
# brcmfmac power save drops the Wi-Fi link.
wifi_powersave = false
