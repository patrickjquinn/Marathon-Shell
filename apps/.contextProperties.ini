; Names an app is given at runtime that qmllint cannot see: Silica's pageStack,
; which pages reach through their context chain (Keel's ApplicationWindow), the
; app runner's context properties, and its qmlRegisterSingletonType
; MusicLibraryManager.
[General]
disableUnqualifiedAccess="pageStack,MARATHON_APP_PATH,MARATHON_APP_ROUTE,MARATHON_APP_ROUTE_PARAMS,MARATHON_DEBUG_ENABLED,ModemManagerCpp,MusicLibraryManager,NavigationRouter"
