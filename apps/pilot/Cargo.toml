# shoal-pilot: the Pilot UI executable. Loads the QML in ui/ and exposes
# the `Pilot` singleton (Shipwright.Pilot 1.0), a CXX-Qt QObject that talks
# to pilotd (org.shipwright.Pilot1) on the session bus.
#
# Its own Cargo workspace, outside crates/: it links Keel's SailfishApp
# (keel-silica-dev), which the shell's build and CI do not have.
[workspace]

[package]
name = "shoal-pilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

# A shared object that is also executable, as every Keel app
# (tools/keel-launcher/link_sailfishapp.rs): installed as /usr/bin/shoal-pilot.
[lib]
crate-type = ["cdylib"]

[dependencies]
futures-lite = "2.6.1"
cxx = "1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_gui", "qt_qml"] }
serde = "1"
serde_json = "1"
zbus = { version = "=6.1.0", default-features = false, features = ["default-rt", "proxy"] }

[build-dependencies]
cxx-qt-build = "=0.10.0"
cc = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = true
strip = true
