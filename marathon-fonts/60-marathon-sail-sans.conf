<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Sailfish's Sail Sans Pro is Jolla's; Keel asks for it by name. Source
     Sans 3, a light, narrow humanist sans (OFL), stands in. -->
<fontconfig>
  <alias binding="same">
    <family>Sail Sans Pro Light</family>
    <prefer><family>Source Sans 3 Light</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sail Sans Pro ExtraLight</family>
    <prefer><family>Source Sans 3 ExtraLight</family></prefer>
  </alias>
  <alias binding="same">
    <family>Sail Sans Pro</family>
    <prefer><family>Source Sans 3</family></prefer>
  </alias>
</fontconfig>
