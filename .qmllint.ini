# qmllint configuration for Marathon.
#
# Levels: disable | info | warning
#
# The two big categories need explaining, because their raw counts are
# alarming and mostly meaningless:
#
#   compiler  -- not defects, and OFF in stock Qt. These are notes from
#                qmlcachegen about which bindings it could not turn into C++
#                ("untyped JavaScript function", "no type annotations").
#                Interpreted bindings are correct, just slower. lint.sh used
#                to opt in with --compiler=warning, which produced 8513
#                messages and buried the 12 real findings. Note that "info"
#                does NOT downgrade them -- they print as Warning at any
#                enabled level -- so the only two settings are on and off.
#                The number that actually matters is the AOT compile rate;
#                get it from scripts/aot-report.sh, which reports a
#                percentage rather than a wall of text.
#
#   unqualified -- worth fixing, and the fix is mechanical: `required
#                property` on delegates rather than leaning on the implicit
#                modelData/index context properties. Left at warning so the
#                count keeps falling.
[General]
AdditionalImportPaths=
DisableDefaultImports=false
UseAbsolutePath=false

[Warnings]
# Real defects -- keep these loud.
ImportFailure=warning
MissingProperty=warning
UnusedImports=warning
UnresolvedType=warning
IncompatibleType=warning
MissingType=warning
InvalidLintDirective=warning
UseProperFunction=warning
TopLevelComponent=warning
DuplicatePropertyBinding=warning

# Mechanical, being worked down.
UnqualifiedAccess=warning

# Advisory codegen notes, not defects -- see the header comment.
CompilerWarnings=disable
