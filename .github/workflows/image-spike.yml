name: Image spike (QEMU)

# Spike for moving image builds off the developer machine
# (reports/CI image builds on GitHub Actions.md): can a hosted arm64
# runner build a full image with the same script as local builds, and
# how much disk and time does it take? Manual only; publishes nothing.

on:
  workflow_dispatch:
  push:
    branches: [ci/image-spike]

permissions:
  contents: read

jobs:
  qemu-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Disk before
        run: df -h / /mnt 2>/dev/null || df -h /

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman qemu-system-arm qemu-efi-aarch64 \
            sshpass mtools util-linux dosfstools e2fsprogs binutils python3-venv \
            debian-archive-keyring

      - name: Loop devices
        run: |
          ls /dev/loop* | head -3
          sudo losetup -f

      # Ubuntu 24.04's AppArmor blocks the capabilities mkosi's unprivileged
      # sandbox needs in its user namespace.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The packages take 2.5 h from cold; keep the build tree between runs.
      - name: Restore build tree
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mb
          key: image-spike-mb-${{ github.sha }}
          restore-keys: image-spike-mb-

      # mkosi's Debian tools tree is broken on arm64 (grub-pc-bin, dnf5);
      # build in Fedora like the developer machines, whose tools tree is
      # Fedora's.
      - name: Build QEMU image
        run: |
          start=$(date +%s)
          (while sleep 60; do
            echo "::notice::t+$(( $(date +%s)-start ))s free $(df --output=avail -h / | tail -1) mem $(free -h | awk '/Mem/{print $3}')"
          done) &
          mkdir -p "$RUNNER_TEMP/mb" "$RUNNER_TEMP/vartmp"
          sudo podman run --rm --privileged --network host \
            -v /dev:/dev -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/mb:/mb" \
            -v "$RUNNER_TEMP/vartmp:/var/tmp" \
            -e MARATHON_BUILD_DIR=/mb -e MARATHON_DEV_SSH_KEY= -w /src \
            registry.fedoraproject.org/fedora:44 bash -euc '
              dnf -y -q install git python3 podman fuse-overlayfs zstd mtools \
                dosfstools e2fsprogs util-linux binutils qemu-img sshpass \
                systemd-ukify erofs-utils gnupg2 apk-tools \
                qemu-system-aarch64 edk2-aarch64 rsync cpio xz openssl file \
                which curl patch make sudo distribution-gpg-keys \
                bubblewrap systemd-container squashfs-tools >/dev/null
              git config --global --add safe.directory "*"
              bash scripts/build-qemu-image.sh'
          echo "::notice::build took $(( $(date +%s)-start ))s"

      - name: Save build tree
        if: always()
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mb
          key: image-spike-mb-${{ github.sha }}

      - name: Results
        if: always()
        run: |
          df -h /
          sudo du -sh "$RUNNER_TEMP/mb"/* 2>/dev/null | sort -rh | head
          find "$RUNNER_TEMP/mb" -maxdepth 4 \( -name '*.raw' -o -name '*.qcow2' -o -name '*.ext4' \) -exec ls -la {} + 2>/dev/null | head
