name: Code Format Check

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
    permissions:
      pull-requests: write

    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm git clang qt6-declarative rust

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run formatters
        id: format
        continue-on-error: true
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          echo "=== Running clang-format ==="
          # keel-silica is Keel as Shipwright formats it (keel-silica/MARATHON-FORK.md).
          clang-format -i $(git ls-files '*.cpp' '*.h' ':!keel-silica')

          echo "=== Running qmlformat ==="
          /usr/lib/qt6/bin/qmlformat -i $(git ls-files '*.qml' ':!crates/keel-actions-codegen/tests/golden' ':!keel-silica')

          echo "=== Checking Rust formatting ==="
          cargo fmt --manifest-path crates/Cargo.toml --all -- --check

          if [[ -n $(git status --porcelain) ]]; then
            echo "needs_formatting=true" >> $GITHUB_OUTPUT
          else
            echo "needs_formatting=false" >> $GITHUB_OUTPUT
          fi

      - name: Post comment on PR if needed
        if: github.event_name == 'pull_request' && steps.format.outputs.needs_formatting == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          message: |
            **Formatting changes required**
            This PR does not follow the formatting rules.
            Please run:
            ```bash
            clang-format -i <files>
            qmlformat -i <files> (must be from Qt 6)
            cargo fmt --manifest-path crates/Cargo.toml --all
            ```
            Commit the updated files and push again.

      - name: Fail job
        if: steps.format.outcome == 'failure' || steps.format.outputs.needs_formatting == 'true'
        run: |
          echo "Formatting required. Failing."
          exit 1
